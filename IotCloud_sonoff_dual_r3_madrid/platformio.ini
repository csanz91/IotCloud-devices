[platformio]
default_envs = esp32dev
extra_configs = ../common_env.ini

[env:esp32dev]
extends = esp32_base, ota_template
board = esp32dev
board_build.variant = sonoff_dualr3
; Installed in a wall: OTA only, so the default partition table (1.25 MB app
; slots) can't change. The BLE scanner fits only because it drives the BT
; controller over HCI (no BLE host stack) and no_ota_stubs drop ArduinoOTA
; and mDNS. The v1.2.0 image (.pio/build/esp32dev/firmware.bin) is
; 1,307,424 of 1,310,720 bytes: 3 KB free. Watch the "OTA size:" line after
; each build, not "Flash:" (which leaves out image headers and padding);
; upload_remote refuses an image that doesn't fit.
lib_extra_dirs =
    ${esp32_base.lib_extra_dirs}
    ../shared/libs
    ../shared/no_ota_stubs
lib_deps =
    ${esp32_base.lib_deps}
model_num = SONOFF_DUAL_R3_MADRID
version = v1.2.0
build_flags = 
    ${esp32_base.build_flags}
    -DIOTCLOUD_ENABLE_PRESENCE_SENSOR
    -DIOTCLOUD_RESET_PIN=BUTTON
    -DIOTCLOUD_RESET_PIN_MODE=INPUT_PULLUP
    -DIOTCLOUD_LED_PIN=LED_LINK
