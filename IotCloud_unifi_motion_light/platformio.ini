[platformio]
default_envs = nodemcuv2
extra_configs = ../common_env.ini

[env:nodemcuv2]
extends = nodemcuv2_base
extra_scripts =
    pre:../tools/add_ota_target.py
    pre:inject_webhook_token.py
lib_deps =
    ${nodemcuv2_base.lib_deps}
build_flags =
    -DIOTCLOUD_RESET_PIN=0
    -DIOTCLOUD_RESET_PIN_MODE=INPUT_PULLUP
    -DIOTCLOUD_LED_PIN=2

[env:nodemcuv2_active_low]
extends = env:nodemcuv2
build_flags =
    ${env:nodemcuv2.build_flags}
    -DMOTION_LIGHT_RELAY_ACTIVE_LOW=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<motion_light_state.cpp>
