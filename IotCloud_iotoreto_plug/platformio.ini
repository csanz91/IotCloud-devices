[platformio]
default_envs = esp8285_2m
extra_configs = ../common_env.ini

[env:esp8285_2m]
extends = esp8285_2m_base, ota_template
lib_deps =
    ${esp8285_2m_base.lib_deps}
model_num = IOTORETO_PLUG
version = v1.0.12
build_flags =
    -DIOTCLOUD_RESET_PIN=5
    -DIOTCLOUD_RESET_PIN_MODE=INPUT_PULLUP
    -DIOTCLOUD_LED_PIN=13
