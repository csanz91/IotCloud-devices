[platformio]
default_envs = esp8285_1m
extra_configs = ../common_env.ini

[env:esp8285_1m]
extends = esp8285_1m_base, ota_template
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m64.ld
board_build.filesystem = littlefs
monitor_speed = 19200
model_num = SONOFF_RF
version = v2.0.3
custom_ota_compress = yes
lib_deps =
    ${esp8285_1m_base.lib_deps}
build_flags =
    -DIOTCLOUD_DISABLE_SERIAL_LOGGING
    -DIOTCLOUD_RESET_PIN=0
    -DIOTCLOUD_RESET_PIN_MODE=INPUT_PULLUP
    -DIOTCLOUD_LED_PIN=13
