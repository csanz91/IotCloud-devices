[platformio]
default_envs = nodemcuv2
extra_configs = ../common_env.ini

[env:nodemcuv2]
extends = nodemcuv2_base, ota_template
lib_deps =
    ${nodemcuv2_base.lib_deps}
    milesburton/DallasTemperature
    paulstoffregen/OneWire
model_num = NODEMCU_CHAIN_WAXER
version = v1.0.2
build_flags =
    -D IOTCLOUD_ENABLE_DS18B20
upload_speed = 230400
