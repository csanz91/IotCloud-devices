[platformio]
default_envs = nodemcu-32s
extra_configs = ../common_env.ini

[env:nodemcu-32s]
extends = esp32_base, ota_template
board = nodemcu-32s
lib_deps =
    ${esp32_base.lib_deps}
    milesburton/DallasTemperature
    paulstoffregen/OneWire
model_num = ESP32_DS18B20_THERMOSTAT
version = v1.3.2
build_flags =
    ${esp32_base.build_flags}
    -DIOTCLOUD_ENABLE_THERMOSTAT
