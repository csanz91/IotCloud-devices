[platformio]
default_envs = esp32dev
extra_configs = ../common_env.ini

[env:esp32dev]
extends = esp32_base, ota_template
board = esp32dev
board_build.variant = sonoff_dualr3
; NimBLE doesn't fit the default 1.25 MB OTA slots. min_spiffs gives two
; 1.9 MB slots. A partition change can't be sent over OTA: flash over serial once.
board_build.partitions = min_spiffs.csv
upload_speed = 921600
lib_deps =
    ${esp32_base.lib_deps}
    h2zero/NimBLE-Arduino@^2.3.8
model_num = SONOFF_DUAL_R3_LITE_BLE
version = v1.0.0
build_flags =
    ${esp32_base.build_flags}
    -DIOTCLOUD_RESET_PIN=BUTTON
    -DIOTCLOUD_RESET_PIN_MODE=INPUT_PULLUP
    -DIOTCLOUD_LED_PIN=LED_LINK
    ; Observer only: drop the NimBLE roles this device never uses.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<ble_beacon.cpp>
