[platformio]
default_envs = esp32dev
extra_configs = ../common_env.ini

[env:esp32dev]
extends = esp32_base, ota_template
board = esp32dev
board_build.variant = sonoff_dualr3
; Two 1.9 MB OTA slots. The scanner now also fits the default 1.25 MB slots
; (see Madrid), but this device already shipped with min_spiffs: keep it.
board_build.partitions = min_spiffs.csv
upload_speed = 921600
; Same libraries as IotCloud_sonoff_dual_r3_madrid, so this device can
; bench-test the in-wall Madrid firmware first.
lib_extra_dirs =
    ${esp32_base.lib_extra_dirs}
    ../shared/libs
    ../shared/no_ota_stubs
model_num = SONOFF_DUAL_R3_LITE_BLE
version = v1.1.0
build_flags =
    ${esp32_base.build_flags}
    -DIOTCLOUD_RESET_PIN=BUTTON
    -DIOTCLOUD_RESET_PIN_MODE=INPUT_PULLUP
    -DIOTCLOUD_LED_PIN=LED_LINK

; Host tests for the beacon filter, HCI parser and tracker: pio test -e native
[env:native]
platform = native
test_framework = unity
lib_extra_dirs = ../shared/libs
lib_deps = IotCloudBleScanner
build_src_filter = -<*>
