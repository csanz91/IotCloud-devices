[platformio]
default_envs = esp32dev
extra_configs = ../common_env.ini

; Sonoff Dual R3 (ESP32) driving a blind motor: relay 1 / S1 = up,
; relay 2 / S2 = down. Four units are installed off-site and are updated by
; OTA only, so the default partition table (1.25 MB app slots) can't change:
; check the "OTA size:" line after each build.
[env:esp32dev]
extends = esp32_base, ota_template
board = esp32dev
board_build.variant = sonoff_dualr3
lib_deps =
    ${esp32_base.lib_deps}
; Must stay SONOFF_DUAL_R3: the installed units listen on v1/ota/update/SONOFF_DUAL_R3.
model_num = SONOFF_DUAL_R3
version = v1.1.0
build_flags =
    ${esp32_base.build_flags}
    -DIOTCLOUD_RESET_PIN=BUTTON
    -DIOTCLOUD_RESET_PIN_MODE=INPUT_PULLUP
    -DIOTCLOUD_LED_PIN=LED_LINK

; Host tests for the debounce / movement logic: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<blinds_core.cpp>
build_flags = -Wall -Wextra
