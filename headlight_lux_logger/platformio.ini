; Headlight lux logger - standalone ESP8266 (NodeMCU) project.
; No IotCloud libraries, no external lib_deps: everything used ships with the
; ESP8266 Arduino core (Wire, ESP8266WebServer, DNSServer, LittleFS).

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp8266_exception_decoder

; 4 MB flash: 1 MB sketch area + 2 MB LittleFS for saved runs.
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

build_flags =
    -Wall
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
