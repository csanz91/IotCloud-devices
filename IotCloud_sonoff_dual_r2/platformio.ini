[platformio]
default_envs = esp8285_1m
extra_configs = ../common_env.ini
src_dir = .

[env:esp8285_1m]
extends = esp8285_1m_base, ota_template
lib_deps =
    ${esp8285_1m_base.lib_deps}
model_num = SONOFF_DUAL_R2
version = v1.0.5
build_flags =
    -DIOTCLOUD_RESET_PIN=10
    -DIOTCLOUD_RESET_PIN_MODE=INPUT_PULLUP
    -DIOTCLOUD_LED_PIN=13
