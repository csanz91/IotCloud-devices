[platformio]
default_envs = esp32dev
extra_configs = ../common_env.ini

[env:esp32dev]
extends = esp32_base, ota_template
board = esp32dev
; Pins (RELAY_1, RELAY_2, BUTTON, LED_LINK, ...) come from this variant.
board_build.variant = sonoff_dualr3
lib_deps =
    ${esp32_base.lib_deps}
    milesburton/DallasTemperature
    paulstoffregen/OneWire
model_num = SONOFF_DUAL_R3_LITE_THERMOSTAT
version = v1.0.7
build_flags =
    ${esp32_base.build_flags}
    -DIOTCLOUD_ENABLE_THERMOSTAT
    -DIOTCLOUD_RESET_PIN=BUTTON
    -DIOTCLOUD_RESET_PIN_MODE=INPUT_PULLUP
    -DIOTCLOUD_LED_PIN=LED_LINK
