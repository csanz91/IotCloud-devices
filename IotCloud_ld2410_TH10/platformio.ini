[platformio]
default_envs = esp8285_1m
extra_configs = ../common_env.ini

[env:esp8285_1m]
; esp8285_1m_base uses eagle.flash.1m.ld (no filesystem), leaving the
; maximum possible staging space for OTA updates on the 1 MB flash chip.
extends = esp8285_1m_base, ota_template
lib_deps =
    ${esp8285_1m_base.lib_deps}
model_num = ESP8266_LD2410_TH10
version = v1.2.0
build_flags =
    -DIOTCLOUD_ENABLE_PRESENCE_SENSOR
    -DIOTCLOUD_RESET_PIN=0
    -DIOTCLOUD_RESET_PIN_MODE=INPUT_PULLUP
    -DIOTCLOUD_LED_PIN=13
