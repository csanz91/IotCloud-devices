[platformio]
default_envs = esp32-c3-supermini
extra_configs = ../common_env.ini

[env:esp32-c3-supermini]
extends = esp32_c3_supermini_base, ota_template
; The BLE scanner doesn't fit the default 1.25 MB app slots. min_spiffs keeps
; two OTA slots of 1.9 MB. A partition change can't go over OTA: flash this
; version over USB once, then OTA works as before.
board_build.partitions = min_spiffs.csv
lib_extra_dirs =
    ${esp32_c3_supermini_base.lib_extra_dirs}
    ../shared/libs
model_num = ESP32_8Button_Keypad
version = v1.1.1
build_flags =
    ${esp32_base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
