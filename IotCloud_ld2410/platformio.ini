[platformio]
default_envs = nodemcuv2
extra_configs = ../common_env.ini

[env:nodemcuv2]
extends = nodemcuv2_base, ota_template
lib_deps =
    ${nodemcuv2_base.lib_deps}
model_num = ESP8266_LD2410
version = v1.2.0
build_flags =
    -DIOTCLOUD_ENABLE_PRESENCE_SENSOR
    -DIOTCLOUD_RESET_PIN=0
    -DIOTCLOUD_RESET_PIN_MODE=INPUT_PULLUP
    -DIOTCLOUD_LED_PIN=13
